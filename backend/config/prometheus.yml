# Prometheus 配置文件 — Coordexa

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'coordexa'
    environment: 'production'

scrape_configs:
  # Coordexa 主应用指标
  - job_name: 'coordexa-backend'
    static_configs:
      - targets: ['backend:8000']
        labels:
          service: 'coordexa'
    scrape_interval: 10s
    metrics_path: '/metrics'

  # Prometheus 自监控
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
